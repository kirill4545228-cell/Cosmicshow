name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unpack zip
        run: |
          mkdir -p _src
          for z in *.zip; do unzip -o "$z" -d _src; done
          POM=$(find _src -name pom.xml | head -n 1)
          echo "Found: $POM"
          echo "PROJECT_DIR=$(dirname "$POM")" >> "$GITHUB_ENV"

      - name: Build with Maven
        run: mvn -B -f "$PROJECT_DIR/pom.xml" package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: CosmicShow-plugin
          path: ${{ env.PROJECT_DIR }}/target/CosmicShow.jar
